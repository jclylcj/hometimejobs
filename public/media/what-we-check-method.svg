<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img"
aria-label="HomeTimeJobs compares a carrier claim with driver experience and operating details before presenting a verified profile.">
  <rect width="1200" height="340" rx="10" fill="#FFFFFF"/>
  <text x="56" y="54" fill="#1A2F3D" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700">What we actually check</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="60" y="105" width="250" height="120" rx="7" fill="#F5F0EB" stroke="#1A2F3D" stroke-width="2"/>
    <text x="185" y="145" text-anchor="middle" fill="#1A2F3D" font-size="17" font-weight="700">Carrier claim</text>
    <text x="185" y="174" text-anchor="middle" fill="#7C8A8A" font-size="13">“Home weekends”</text>
    <text x="185" y="196" text-anchor="middle" fill="#7C8A8A" font-size="13">“Up to 75¢ CPM”</text>

    <path d="M312 165 H430" stroke="#2AA09A" stroke-width="4" stroke-linecap="round"/>
    <path d="M420 157 L432 165 L420 173" fill="none" stroke="#2AA09A" stroke-width="4"/>

    <rect x="440" y="92" width="320" height="146" rx="7" fill="#F5F0EB" stroke="#1A2F3D" stroke-width="2"/>
    <text x="600" y="127" text-anchor="middle" fill="#1A2F3D" font-size="17" font-weight="700">Translate + verify</text>
    <text x="600" y="158" text-anchor="middle" fill="#7C8A8A" font-size="13">actual schedule · pay structure</text>
    <text x="600" y="181" text-anchor="middle" fill="#7C8A8A" font-size="13">equipment · freight · policies</text>
    <circle cx="600" cy="211" r="7" fill="#F2B544"/>

    <path d="M762 165 H880" stroke="#2AA09A" stroke-width="4" stroke-linecap="round"/>
    <path d="M870 157 L882 165 L870 173" fill="none" stroke="#2AA09A" stroke-width="4"/>

    <rect x="890" y="105" width="250" height="120" rx="7" fill="#F5F0EB" stroke="#1A2F3D" stroke-width="2"/>
    <text x="1015" y="145" text-anchor="middle" fill="#1A2F3D" font-size="17" font-weight="700">Driver-ready profile</text>
    <text x="1015" y="174" text-anchor="middle" fill="#7C8A8A" font-size="13">what the job means</text>
    <text x="1015" y="196" text-anchor="middle" fill="#7C8A8A" font-size="13">for your actual life</text>
  </g>

  <!-- honest return loop -->
  <path d="M1015 238 C960 286 725 296 595 254" fill="none" stroke="#7C8A8A" stroke-width="2" stroke-dasharray="5 5"/>
  <path d="M605 247 L593 254 L605 261" fill="none" stroke="#7C8A8A" stroke-width="2"/>
  <text x="805" y="300" text-anchor="middle" fill="#7C8A8A" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">new evidence can change the profile</text>
</svg>