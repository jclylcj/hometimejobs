<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img"
aria-label="A schedule spectrum from Home Daily through Long OTR, showing increasing time away from home.">
  <rect width="1200" height="330" rx="10" fill="#FFFFFF"/>
  <text x="58" y="55" fill="#1A2F3D" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700">Start with the schedule</text>
  <text x="58" y="82" fill="#7C8A8A" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15">The labels sound simple. The lived schedule is the part that matters.</text>
  <path d="M105 196 H1090" stroke="#CFC8C0" stroke-width="3"/>
  <path d="M105 196 C320 196 470 194 650 196 C830 198 960 193 1090 196" stroke="#2AA09A" stroke-width="5" stroke-linecap="round"/>

  <!-- nodes -->
  <circle cx="145" cy="196" r="16" fill="#FFFFFF" stroke="#1A2F3D" stroke-width="3"/><circle cx="145" cy="196" r="5" fill="#F2B544"/><circle cx="365" cy="196" r="16" fill="#FFFFFF" stroke="#1A2F3D" stroke-width="3"/><circle cx="365" cy="196" r="5" fill="#F2B544"/><circle cx="585" cy="196" r="16" fill="#FFFFFF" stroke="#1A2F3D" stroke-width="3"/><circle cx="585" cy="196" r="5" fill="#F2B544"/><circle cx="805" cy="196" r="16" fill="#FFFFFF" stroke="#1A2F3D" stroke-width="3"/><circle cx="805" cy="196" r="5" fill="#F2B544"/><circle cx="1025" cy="196" r="16" fill="#FFFFFF" stroke="#1A2F3D" stroke-width="3"/><circle cx="1025" cy="196" r="5" fill="#F2B544"/>

  <g font-family="ui-sans-serif, system-ui, sans-serif" text-anchor="middle">
    <text x="145" y="151" fill="#1A2F3D" font-size="16" font-weight="700">Home Daily</text>
    <text x="365" y="151" fill="#1A2F3D" font-size="16" font-weight="700">Home Weekends</text>
    <text x="585" y="151" fill="#1A2F3D" font-size="16" font-weight="700">7 on / 7 off</text>
    <text x="805" y="151" fill="#1A2F3D" font-size="16" font-weight="700">14 on / 7 off</text>
    <text x="1025" y="151" fill="#1A2F3D" font-size="16" font-weight="700">Long OTR</text>

    <text x="145" y="236" fill="#7C8A8A" font-size="13">home every night</text>
    <text x="365" y="236" fill="#7C8A8A" font-size="13">out weekdays</text>
    <text x="585" y="236" fill="#7C8A8A" font-size="13">predictable full week</text>
    <text x="805" y="236" fill="#7C8A8A" font-size="13">two weeks out</text>
    <text x="1025" y="236" fill="#7C8A8A" font-size="13">3+ weeks out</text>
  </g>

  <path d="M115 279 H405" stroke="#F2B544" stroke-width="3"/>
  <text x="115" y="304" fill="#7C8A8A" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">MORE FREQUENT HOME TIME</text>
  <path d="M795 279 H1085" stroke="#1A2F3D" stroke-width="3"/>
  <text x="1085" y="304" text-anchor="end" fill="#7C8A8A" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">MORE TIME AWAY</text>
</svg>